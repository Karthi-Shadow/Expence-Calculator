<!DOCTYPE html>
<html>
<head>
    <title>Personal Expense Calculator</title>
    <style>
        body {
            font-family: popins;
            background-color: #f2f2f2;
        }

        .container {
            width: 500px;
            margin: 50px auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        h2 {
            margin-top: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input,select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {    
            margin-top: 20px;
            padding: 10px 20px;
            background-color: black;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: gray;
        }

        #expenseList {
             padding-left: 25px;
        }

        #message {
            font-weight: bold;
        }

    </style>
</head>

<body>
    <script>
        let expenses = [];
        let totalExpense = 0;

        function addExpense() {

            let category = document.getElementById("category").value;
            let amount = Number(document.getElementById("amount").value);

            if (category == "" || amount <= 0) {
                alert("Please enter valid details");
                return;
            }

            expenses.push(category + " - ₹" + amount);

            totalExpense = totalExpense + amount;

            displayExpenses();

            calculateSavings();

            document.getElementById("amount").value = "";
            document.getElementById("category").value = "";
        }


function displayExpenses() {

    let list = document.getElementById("expenseList");

    list.innerHTML = "";

    for (let i = 0; i < expenses.length; i++) {

        let item = document.createElement("li");

        item.innerHTML = expenses[i];

        list.appendChild(item);
    }
}


function calculateSavings() {

    let income = Number(document.getElementById("income").value);

    let savings = income - totalExpense;

    document.getElementById("totalExpense").innerHTML =
        totalExpense;

    document.getElementById("savings").innerHTML =
        savings;


    if (savings > 0) {

        document.getElementById("message").innerHTML =
            "You have saved money.";

    }
    else if (savings == 0) {

        document.getElementById("message").innerHTML =
            "You have used your entire income.";

    }
    else {

        document.getElementById("message").innerHTML =
            "Warning! Your expenses are more than your income.";

    }
}
    </script>
    <div class="container">

        <h1>Personal Expense Calculator</h1>

        <label>Enter Your Income:</label>
        <input type="number" id="income" placeholder="Enter income">

        <h2>Add Expense</h2>

        <label>Category:</label>
        <select id="category">
            <option value="">Select Category</option>
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Education">Education</option>
            <option value="Shopping">Shopping</option>
            <option value="Bills">Bills</option>
            <option value="Others">Others</option>
        </select>

        <label>Amount:</label>
        <input type="number" id="amount" placeholder="Enter amount">

        <button onclick="addExpense()">Add Expense</button>

        <h2>Expense Details</h2>

        <ul id="expenseList"></ul>

        <h2>Summary</h2>

        <p>Total Expense: ₹<span id="totalExpense">0</span></p>
        <p>Savings: ₹<span id="savings">0</span></p>

        <p id="message"></p>

    </div>

    <script src="script.js"></script>

</body>
</html>
